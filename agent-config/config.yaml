# SWA Agent config for a native macOS (darwin/arm64) host.
#
# Differences from the Ansible template shipped in the release bundle:
#   * agent.socketPath is under $HOME, NOT /run — macOS has no /run and SIP
#     prevents creating one.
#   * workload attestor is `unix` only. The `docker` attestor crashes the
#     1.0.2 agent on first attestation (known build defect).
trustDomain:
  name: swa-lab.local

bootstrap:
  # Public, unauthenticated CA-bundle endpoint on the SaaS tenant, so we never
  # need bootstrap.insecure: true.
  bundleSourceUrl: https://apj-secrets.secretsmgr.cyberark.cloud/api/swa/trust-domains/swa-lab.local/.well-known/ca-bundles
  insecure: false

servers:
  # Must match the server cert SAN (DNS:server.<trust-domain>).
  # Requires: 127.0.0.1 server.swa-lab.local  in /etc/hosts
  - addr: 127.0.0.1:8443

agent:
  socketPath: /tmp/swa-agent/public/api.sock
  nodeAttestor:
    type: x509pop
    config:
      cert: x509pop.cert
      key: x509pop.key

workload:
  attestors:
    - type: unix
      config:
        discover_workload_path: true
        workload_size_limit: 0

telemetry:
  logging:
    level: debug
